<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="home" href="{{ '/' | relative_url }}">Mielina</a>
    {% if page.counterpart %}
    <a class="language" href="{{ page.counterpart | relative_url }}" hreflang="{% if page.lang == 'ro' %}en{% else %}ro{% endif %}">{{ page.counterpart_label }}</a>
    {% endif %}
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    <p>
      <a href="{{ '/privacy.html' | relative_url }}" hreflang="en">Privacy policy</a> ·
      <a href="{{ '/privacy.ro.html' | relative_url }}" hreflang="ro" lang="ro">Politica de confidențialitate</a>
    </p>
    <p>
      <a href="{{ '/support.html' | relative_url }}" hreflang="en">Support</a> ·
      <a href="{{ '/support.ro.html' | relative_url }}" hreflang="ro" lang="ro">Asistență</a> ·
      <a href="mailto:mielina.support@gmail.com">mielina.support@gmail.com</a>
    </p>
  </footer>
</body>
</html>
